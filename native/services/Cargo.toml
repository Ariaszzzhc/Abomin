[package]
name = "abomin_services"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
oxc = { version = "=0.154.0", features = ["transformer", "codegen", "semantic"] }
encoding_rs = "=0.8.35"
base64 = "=0.22.1"
aws-lc-rs = "=1.14.1"
futures = "=0.3.31"
futures-rustls = "=0.26.0"
rustls = { version = "=0.23.32", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "=1.0.3"
hyper = { version = "=1.7.0", features = ["client", "http1", "http2"] }
http-body-util = "=0.1.3"
bytes = "=1.10.1"
rustls-pemfile = "=2.2.0"
